# cargo-mutants configuration (ADR 0050). `just mutants` runs it.
#
# Every entry in exclude_re needs a reason. A mutant belongs here if no input can
# change any result. If it changes only speed, it belongs here when the cost stays
# within a chunk or a constant. It stays in the weekly report if a test could pin
# it, such as a chunk count. Code that an entry would prove removable is removed
# instead. Anything else gets a test, or stays in the weekly report until it does.
#
# A pattern starts with the mutation's column, so a new `<` elsewhere in the
# function is still tested, and an edit above it does not undo the entry. It
# then names exactly one mutant. `just mutants-exclusions` checks that, and the
# weekly report lists any entry that has gone stale. Write [0-9], not \d: that
# check reads these patterns with grep -E.

# As everywhere in CI: a run must not change the lockfile.
additional_cargo_args = ["--locked"]

# A hang ends here. Twice the slowest test run seen on a busy runner (ADR 0050),
# so a mutant that is only slow still gets its verdict.
minimum_test_timeout = 30

exclude_re = [
    # The one broad entry, and the first exception, on purpose: any Debug impl,
    # today's and later ones.
    # Debug output is for people reading logs. No behavior depends on it, and
    # pinning its format would only make it harder to change. This is not
    # strictly an equivalent mutant.
    "<impl (std::)?(fmt::)?Debug for ",

    # motion.rs. line_end past the last row is the end of the buffer, by its
    # contract, so any row from the last on gives the same answer.
    ":[0-9]+:36: replace - with \\+ in buffer_end",
    ":[0-9]+:36: replace - with / in buffer_end",
    # n == 0 cannot be above the first row: the other half is row < 0.
    ":[0-9]+:10: replace < with <= in move_lines",
    # n == 0 takes no step, so which way it would step does not matter.
    ":[0-9]+:21: replace < with <= in move_clusters",
    ":[0-9]+:23: replace < with <= in move_clusters",

    # window.rs. At the same row, next.top = row changes nothing, and the else
    # branch is not taken since a ViewSize has at least 1 row.
    ":[0-9]+:19: replace < with <= in follow",
    # At the same column, next.left = column changes nothing, and the else
    # branch needs a cluster wider than min(cells, columns), which it never is.
    ":[0-9]+:22: replace < with <= in follow",
    # When the cluster's right edge is exactly at the window's, the new left is
    # the old one.
    ":[0-9]+:21: replace > with >= in follow",
    # Scrolling by 0 rows stays at top in both branches: bottom is at least top.
    ":[0-9]+:13: replace < with <= in wheel",

    # decode.rs. At fed == BINARY_SNIFF_BYTES the sniffed slice is empty.
    ":[0-9]+:21: replace < with <= in Decoder::inspect",
    # The offset is shifted past the byte's 8 bits, so | and ^ are the same.
    ":[0-9]+:73: replace \\| with \\^ in InvalidBytes::extend",
    # A shortcut. An empty set has no block to find, and in an empty range the
    # first entry found is already at or past its end.
    ":[0-9]+:28: replace \\|\\| with && in InvalidBytes::range",

    # display_map/cell.rs. U+FFFF is not invisible, so it never gets here, and
    # the digit count differs at no other code point.
    ":[0-9]+:34: replace > with >= in escape",
    # at == cluster_end assigns cluster_end to itself.
    ":[0-9]+:23: replace < with <= in <impl Iterator for Clusters<'a>>::next",

    # display_map/tab_map.rs. A shortcut to the target row in the chunk: the
    # loop below walks to the same row and column, at most a chunk more slowly.
    ":[0-9]+:23: replace > with < in TabMap::locate",

    # rope.rs. A GraphemeCursor at offset 0 or at the end of its text starts in
    # the "break" state and says "boundary" by itself, so the check only saves
    # building one.
    ":[0-9]+:20: replace \\|\\| with && in is_grapheme_boundary",

    # sum_tree.rs. The second exception, and not equivalent: MIN_CHILDREN is 2 in
    # tests, where 2 * 2 is 2 + 2, so no test can see this. In a release build the
    # most children would be 10, not 16, against MIN_CHILDREN's documented floor,
    # but nothing reads MIN_CHILDREN outside tests, so only speed differs.
    "sum_tree.rs:[0-9]+:31: replace \\* with \\+",
]
