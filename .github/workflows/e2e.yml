# End-to-end tests over the control socket (ADR 0037, ADR 0049): on Linux with
# Xvfb and lavapipe, and on macOS, the one runner that draws text. Nothing here
# reads a baseline or writes anything back, so the token stays read-only
# (ADR 0021).
name: E2E

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: just e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Not Windows: the control socket does not support it yet (ADR 0032).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: ./.github/actions/install-just
      # Linux has no display or GPU: Xvfb and lavapipe, as in perf.yml. It draws
      # no text yet (ADR 0036), and the flows say what that changes.
      - name: Install a virtual display and lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-vulkan-drivers libvulkan1 libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0
      - name: End-to-end tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1280x800x24' just e2e
          else
            just e2e
          fi
      # The same flows on oso's own window layer, until it is the default (ADR 0070).
      - name: End-to-end tests on the native window layer
        if: runner.os == 'macOS'
        run: just e2e-native
      # Panes in real pixels (ADR 0061). The glyphs come from a fake text system,
      # so Linux asserts the same as macOS. No display is needed.
      - name: Pixel tests
        run: just pixel-tests
