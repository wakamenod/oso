# End-to-end tests over the control socket (ADR 0037, ADR 0049): on Linux with
# Xvfb and lavapipe, and on macOS, the one runner that draws text, on oso's own
# window layer (ADR 0070). Nothing here reads a baseline or writes anything back,
# so the token stays read-only (ADR 0021).
name: E2E

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: just e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Not Windows: the control socket does not support it yet (ADR 0032).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: $/.github/actions/install-just
      # Zig and libghostty-vt's tarballs for oso-term's build script (ADR 0120).
      - uses: $/.github/actions/install-zig
      - uses: $/.github/actions/fetch-ghostty-vt
      # Linux has no display or GPU: Xvfb and lavapipe, as in perf.yml. It draws
      # no text yet (ADR 0036), and the flows say what that changes.
      - name: Install a virtual display and lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-vulkan-drivers libvulkan1 libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0
      - name: End-to-end tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1280x800x24' just e2e
          else
            just e2e
          fi
      # Panes in real pixels (ADR 0061). The glyphs come from a fake text system,
      # so Linux asserts the same as macOS. No display is needed.
      - name: Pixel tests
        run: just pixel-tests

  # ADR 0070's early task: show that lavapipe presents under a headless Wayland compositor,
  # before Linux CI moves off Xvfb at stage 4. It runs the same flows on winit's Wayland
  # backend, with no X server, and gates nothing yet.
  e2e-wayland:
    name: just e2e (ubuntu-latest, headless Wayland)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: false
      - uses: $/.github/actions/install-just
      # Zig and libghostty-vt's tarballs for oso-term's build script (ADR 0120).
      - uses: $/.github/actions/install-zig
      - uses: $/.github/actions/fetch-ghostty-vt
      # Weston with its headless backend and its GL renderer on Mesa's software EGL, lavapipe,
      # and what winit's Wayland backend loads at run time, all from Ubuntu's archive.
      - name: Install a headless Wayland compositor and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weston mesa-vulkan-drivers libvulkan1 libwayland-client0 libwayland-cursor0 libxkbcommon0 \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri
          weston --version
          dpkg-query -W -f '${Package} ${Version}\n' weston 'libweston-*' libpixman-1-0 \
            libwayland-server0 mesa-vulkan-drivers libegl-mesa0
      # The script runs Weston's GL renderer, since its pixman one crashed now and then (see
      # the script). Should Weston crash still, it keeps the core and says where with a
      # backtrace, and what the clients sent it last.
      - name: End-to-end tests under headless Weston
        env:
          WESTON_PROTOCOL_LOG: 1
        run: bash .github/scripts/e2e-weston.sh "$RUNNER_TEMP/weston" just e2e
      - name: The compositor's log
        if: always()
        run: cat "$RUNNER_TEMP"/weston/weston.{log,out,probe} || true
