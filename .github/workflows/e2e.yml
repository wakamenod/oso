# End-to-end tests over the control socket (ADR 0037, ADR 0049): on Linux with
# Xvfb and lavapipe, and on macOS, the one runner that draws text, on oso's own
# window layer (ADR 0070). Nothing here reads a baseline or writes anything back,
# so the token stays read-only (ADR 0021).
name: E2E

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: just e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Not Windows: the control socket does not support it yet (ADR 0032).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: $/.github/actions/install-just
      # Linux has no display or GPU: Xvfb and lavapipe, as in perf.yml. It draws
      # no text yet (ADR 0036), and the flows say what that changes.
      - name: Install a virtual display and lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-vulkan-drivers libvulkan1 libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0
      - name: End-to-end tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1280x800x24' just e2e
          else
            just e2e
          fi
      # Panes in real pixels (ADR 0061). The glyphs come from a fake text system,
      # so Linux asserts the same as macOS. No display is needed.
      - name: Pixel tests
        run: just pixel-tests

  # ADR 0070's early task: show that lavapipe presents under a headless Wayland compositor,
  # before Linux CI moves off Xvfb at stage 4. It runs the same flows on winit's Wayland
  # backend, with no X server, and gates nothing yet.
  e2e-wayland:
    name: just e2e (ubuntu-latest, headless Wayland)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: false
      - uses: $/.github/actions/install-just
      # Weston with its headless backend and the software renderer, lavapipe, and what
      # winit's Wayland backend loads at run time, all from Ubuntu's archive.
      - name: Install a headless Wayland compositor and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weston mesa-vulkan-drivers libvulkan1 libwayland-client0 libwayland-cursor0 libxkbcommon0
          weston --version
      - name: End-to-end tests under headless Weston
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          probe="$RUNNER_TEMP/weston.probe"
          # Weston writes its own log, which it flushes, and the shell around it notes how it
          # ended: its status, or 128 and the number of the signal that ended it. The shell
          # also notes any signal it catches, and the process group and session of Weston, of
          # itself and of this step's shell, so that a kill of a group or a session shows. It
          # runs without `-e`, which the step's shell has: under it, Weston's failing status
          # would end the shell before it says so.
          ( set +e
            for sig in HUP INT QUIT TERM USR1 USR2 PIPE; do
              # shellcheck disable=SC2064 # the signal's name is wanted now, the time later
              trap "echo \"subshell caught SIG$sig at \$(date -u +%T.%N)\" >> \"$probe\"" "$sig"
            done
            weston --backend=headless --renderer=pixman --width=1280 --height=800 \
              --socket=wayland-oso --idle-time=0 --log="$RUNNER_TEMP/weston.log" \
              > "$RUNNER_TEMP/weston.out" 2>&1 &
            weston_pid=$!
            echo "$weston_pid" > "$RUNNER_TEMP/weston.pid"
            ps -o pid,ppid,pgid,sid,comm -p "$weston_pid,$BASHPID,$$" >> "$probe"
            # A caught signal ends a wait early: wait again while Weston runs.
            while :; do
              wait "$weston_pid"
              weston_status=$?
              kill -0 "$weston_pid" 2> /dev/null || break
            done
            echo "weston exited with status $weston_status" >> "$RUNNER_TEMP/weston.out" ) &
          for _ in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/wayland-oso" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/wayland-oso" ] || {
            cat "$RUNNER_TEMP/weston.log" "$RUNNER_TEMP/weston.out" "$probe"
            exit 1
          }
          # When Weston goes, to 200 ms, to line up with the flows' own times.
          ( set +e
            weston_pid=$(cat "$RUNNER_TEMP/weston.pid")
            while kill -0 "$weston_pid" 2> /dev/null; do sleep 0.2; done
            echo "weston gone by $(date -u +%T.%N)" >> "$probe" ) &
          # No X server, so winit can only take Wayland.
          status=0
          env -u DISPLAY WAYLAND_DISPLAY=wayland-oso just e2e || status=$?
          # Whether the compositor outlived the flows: when it did not, every flow after it
          # fails to connect. Then what the kernel said, as of a process it killed or that
          # crashed, and how much memory there was.
          if pgrep -x weston > /dev/null; then
            echo "weston is still running"
          else
            echo "::warning::weston was gone before the flows ended; see the compositor's log"
            echo "::group::The kernel's log, memory and processes"
            sudo dmesg -T | tail -60 || true
            free -m || true
            ps -eo pid,ppid,pgid,sid,stat,etime,comm || true
            echo "::endgroup::"
          fi
          exit "$status"
      - name: The compositor's log
        if: always()
        run: cat "$RUNNER_TEMP/weston.log" "$RUNNER_TEMP/weston.out" "$RUNNER_TEMP/weston.probe" || true

