# CodeQL code scanning, in place of the repository's default setup, on pushes to main and
# nightly, not on pull requests (ADR 0166). Actions are pinned by the lockfile (ADR 0080).
# The job names and categories are the default setup's, so the alerts' history stays the
# same.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Nightly (ADR 0166).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:rust

  actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:actions
