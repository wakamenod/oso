# One-off experiment, to be removed before merge: why the macOS benchmarks run about
# 3.5 times slower than Linux's. Every paced key loop of the harness takes about 120 ms
# on GitHub's macOS runner for a 25 to 41 ms sleep, so this measures what a 25 ms
# thread::sleep really takes there, and the QoS and latency tier the steps run with,
# plainly, under `taskpolicy -l 0 -t 0`, at user-interactive QoS,
# against a spinning wait and beside a spinning thread. It builds and runs no repository code.
name: Sleep probe

on:
  pull_request:
    paths: [".github/workflows/sleep-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Build the probe
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          cat > probe.rs <<'EOF'
          use std::thread;
          use std::time::{Duration, Instant};

          unsafe extern "C" {
              fn qos_class_self() -> u32;
              fn pthread_set_qos_class_self_np(class: u32, relative: i32) -> i32;
              fn getpriority(which: i32, who: u32) -> i32;
          }

          const QOS_CLASS_USER_INTERACTIVE: u32 = 0x21;
          const PRIO_DARWIN_PROCESS: i32 = 4;

          fn qos_name(class: u32) -> &'static str {
              match class {
                  0x21 => "user-interactive",
                  0x19 => "user-initiated",
                  0x15 => "default",
                  0x11 => "utility",
                  0x09 => "background",
                  0x00 => "unspecified",
                  _ => "other",
              }
          }

          fn main() {
              let label = std::env::args().nth(1).unwrap_or_default();
              if std::env::args().any(|a| a == "--interactive") {
                  // SAFETY: sets the calling thread's own QoS; takes no pointers.
                  let status = unsafe { pthread_set_qos_class_self_np(QOS_CLASS_USER_INTERACTIVE, 0) };
                  println!("set user-interactive: {status}");
              }
              // SAFETY: reads the calling thread's QoS; takes no pointers.
              let qos = unsafe { qos_class_self() };
              // SAFETY: reads this process's background state; takes no pointers.
              let darwin_bg = unsafe { getpriority(PRIO_DARWIN_PROCESS, 0) };
              let args: Vec<String> = std::env::args().collect();
              let ms = args
                  .iter()
                  .position(|a| a == "--ms")
                  .and_then(|i| args.get(i + 1)?.parse().ok())
                  .unwrap_or(25u64);
              let spin = args.iter().any(|a| a == "--spin");
              if args.iter().any(|a| a == "--busy-neighbour") {
                  // Keeps one more CPU awake the whole time.
                  thread::spawn(|| loop {
                      std::hint::spin_loop();
                  });
              }
              let pace = Duration::from_millis(ms);
              let mut samples = Vec::new();
              for _ in 0..200 {
                  let started = Instant::now();
                  if spin {
                      while started.elapsed() < pace {
                          std::hint::spin_loop();
                      }
                  } else {
                      thread::sleep(pace);
                  }
                  samples.push(started.elapsed().as_secs_f64() * 1000.0);
              }
              let total: f64 = samples.iter().sum();
              samples.sort_by(f64::total_cmp);
              let at = |p: f64| samples[((samples.len() - 1) as f64 * p) as usize];
              println!(
                  "{label}: qos {} ({qos:#x}), darwin bg {darwin_bg}; 200 x {} {ms} ms: \
                   min {:.1}, p50 {:.1}, p90 {:.1}, p99 {:.1}, max {:.1}, mean {:.1} ms",
                  qos_name(qos),
                  if spin { "spin" } else { "sleep" },
                  at(0.0),
                  at(0.5),
                  at(0.9),
                  at(0.99),
                  at(1.0),
                  total / samples.len() as f64,
              );
          }
          EOF
          rustc --version
          rustc -O --edition 2024 probe.rs -o probe
      - name: The step's process and its ancestors
        run: |
          pid=$$
          while [ "$pid" -gt 1 ]; do
            ps -o pid=,ppid=,pri=,nice=,command= -p "$pid" | cut -c1-160
            pid=$(ps -o ppid= -p "$pid" | tr -d ' ')
          done
          echo "--- launchctl procinfo of this step's shell"
          sudo launchctl procinfo $$ | grep -iE 'qos|tier|role|darwin|background|priority|clamp|apptype' || true
          echo "--- the same under taskpolicy -l 0 -t 0"
          taskpolicy -l 0 -t 0 sh -c 'sudo launchctl procinfo $$' | grep -iE 'qos|tier|role|darwin|background|priority|clamp|apptype' || true
      - name: Sleep, as the benchmark runs now
        run: |
          "$RUNNER_TEMP/probe/probe" plain
          "$RUNNER_TEMP/probe/probe" plain-again
      - name: Sleep under taskpolicy -l 0 -t 0
        run: |
          taskpolicy -l 0 -t 0 "$RUNNER_TEMP/probe/probe" taskpolicy
          taskpolicy -l 0 -t 0 "$RUNNER_TEMP/probe/probe" taskpolicy-again
      - name: Sleep at user-interactive QoS
        run: |
          "$RUNNER_TEMP/probe/probe" interactive --interactive
          taskpolicy -l 0 -t 0 "$RUNNER_TEMP/probe/probe" both --interactive
      - name: Short sleeps, spinning, and a busy neighbour
        run: |
          "$RUNNER_TEMP/probe/probe" sleep-1ms --ms 1
          "$RUNNER_TEMP/probe/probe" sleep-5ms --ms 5
          "$RUNNER_TEMP/probe/probe" spin --spin
          "$RUNNER_TEMP/probe/probe" busy-neighbour --busy-neighbour
          sysctl hw.ncpu kern.timer.coalescing_enabled kern.timer_coalesce_bg_ns_max kern.timer_coalesce_tier3_ns_max || true
