# Performance results and regression checks (ADR 0024, ADR 0025, ADR 0044).
# Results go to the job summary and to JSON artifacts. Pushes to main only
# report: their results become the baseline, so a regression accepted on
# purpose does not fail every later pull request.
name: Perf

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: benchmarks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Not Windows: the control socket does not support it yet (ADR 0032).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      # To read the baseline: the artifacts of earlier runs on main.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.52.0
          fallback: none
      # Linux has no display or GPU: Xvfb and lavapipe, Mesa's software Vulkan
      # driver. It draws no text yet (ADR 0036).
      - name: Install a virtual display and lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-vulkan-drivers libvulkan1 libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0
      - name: Benchmark
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1280x800x24' just perf target/perf/perf.json
          else
            just perf target/perf/perf.json
          fi
      - name: Fetch the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/perf-baseline.sh "perf-$RUNNER_OS" target/perf/baseline
      - name: Doctor the baseline (temporary)
        run: |
          mkdir -p target/perf/baseline
          python3 -c "import json; r=json.load(open('target/perf/perf.json')); [m.update(value=m['value']/5) for m in r['metrics'].values()]; json.dump(r,open('target/perf/baseline/perf.json','w'))"
      - name: Compare
        env:
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          status=0
          just perf-compare target/perf/baseline/perf.json target/perf/perf.json || status=$?
          cat target/perf/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$ON_MAIN" = true ]; then
            [ "$status" -eq 0 ] || echo "::warning::performance regressed; this result is the new baseline"
            exit 0
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: perf-${{ runner.os }}
          path: target/perf/perf.json
          if-no-files-found: error
          retention-days: 90

  # ADR 0024: every platform records the time; the author's Mac alone decides
  # the 2 s budget.
  build-time:
    name: build time (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.52.0
          fallback: none
      - run: just build-time target/perf/build-time.json
      - name: Fetch the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/perf-baseline.sh "build-time-$RUNNER_OS" target/perf/baseline
      - name: Compare
        env:
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          status=0
          just perf-compare target/perf/baseline/build-time.json target/perf/build-time.json || status=$?
          cat target/perf/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$ON_MAIN" = true ]; then
            [ "$status" -eq 0 ] || echo "::warning::the build time regressed; this result is the new baseline"
            exit 0
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: build-time-${{ runner.os }}
          path: target/perf/build-time.json
          if-no-files-found: error
          retention-days: 90
