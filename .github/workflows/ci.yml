# CI for oso (ADR 0018, ADR 0021). Actions are pinned by commit SHA; update
# the SHA and the version comment together. It runs on every push to main, and on a branch
# only when started by hand; pull requests run none of it (ADR 0188).
name: CI

on:
  push:
    branches: [main]
  # On a branch, for a change worth a full run before it merges: gh workflow run ci.yml --ref <branch>.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each push to main has a group of its own, so the next push never cancels it and every
  # commit on main has a result (ADR 0188). A run started by hand on a branch cancels the
  # branch's earlier one.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && format('main-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: just ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos, windows-latest]
    # macOS runs on the author's self-hosted Mac (docs/dev/ci-runner.md, ADR 0166). The Mac
    # has two runners: this job asks for oso-ci, the second one's label, and e2e asks for oso,
    # the first one's, so that the two run at once and only one opens windows. The repository
    # variable OSO_MACOS_RUNNER, a runner label such as macos-latest, overrides the Mac while
    # it is offline. No pull request runs this workflow (ADR 0188); the runner's own
    # job-started hook refuses a fork's job all the same.
    runs-on: ${{ matrix.os != 'macos' && matrix.os || vars.OSO_MACOS_RUNNER || fromJSON('["self-hosted", "macOS", "ARM64", "oso-ci"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          # Only main writes the cache, so a branch cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The self-hosted Mac keeps its build between jobs instead, outside the workspace, which
      # checkout cleans: branches (the pr folder) and main each have their own, so main never
      # builds on what a branch left (ADR 0166). Each runner has its own folder, named as the
      # runner, and its hooks clean only that one. git clean removes only the link.
      - name: Keep the build on the runner
        if: runner.environment == 'self-hosted'
        env:
          KIND: ${{ github.ref == 'refs/heads/main' && 'main' || 'pr' }}
          JOB: ${{ github.job }}
          # So that A-Z below means ASCII letters only.
          LC_ALL: C
        run: |
          # The hooks refuse the same names; pr and main were the folders of a single runner.
          case "$RUNNER_NAME" in
            '' | . | .. | pr | main | *[!A-Za-z0-9._-]*)
              echo "error: the runner's name cannot name a build folder: '$RUNNER_NAME'"
              exit 1 ;;
          esac
          dir="$HOME/ci-target/$RUNNER_NAME/$KIND/$JOB"
          mkdir -p "$dir"
          rm -rf target
          ln -s "$dir" target
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: $/.github/actions/install-just
      # Zig and libghostty-vt's tarballs for oso-term's build script (ADR 0120); Windows
      # builds no terminal yet.
      - if: runner.os != 'Windows'
        uses: $/.github/actions/install-zig
      - if: runner.os != 'Windows'
        uses: $/.github/actions/fetch-ghostty-vt
      # On Windows, just runs recipes with Git Bash's sh. Fail early if missing.
      - run: sh -c 'command -v sh'
      - run: just ci
      # oso-platform's macOS API, with oso's own window layer, has a snapshot of its own,
      # taken on macOS (ADR 0070). It runs here rather than in a job of its own, so that a
      # push starts one macOS job fewer. Nightly is installed only for it, for rustdoc JSON;
      # versions come from the Justfile.
      - name: Install nightly and cargo-public-api
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install "$(just --evaluate nightly)" --profile minimal
          rustup target add --toolchain "$(just --evaluate nightly)" "$(just --evaluate api_macos_target)"
          cargo install --locked "cargo-public-api@$(just --evaluate cargo_public_api)"
      - name: Public API on macOS
        if: runner.os == 'macOS'
        run: just public-api-macos-check
      # The macOS release binary has oso's own window layer, with dev-only code of its own, so
      # it is searched here too, as the release-safety job searches Linux's (ADR 0016,
      # ADR 0070).
      - name: Release safety on macOS
        if: runner.os == 'macOS'
        run: just release-safety
      # Warns, and does not fail. The budget is 30 s on the author's Mac, and
      # this runner takes twice as long: 7.6 to 9.4 s against 4.6 s (ADR 0050).
      - name: Test time budget
        if: runner.os == 'Linux'
        run: just test-time 60

  # End-to-end tests (e2e.yml), on every run (ADR 0174, ADR 0188).
  e2e:
    uses: ./.github/workflows/e2e.yml

  # The one check that says whether a commit's CI passed (ADR 0166, ADR 0188): it fails when
  # a job above failed or was cancelled, and passes when each succeeded or was skipped. It
  # runs even when the run is cancelled, so a cancelled run never reads as passed.
  ci-ok:
    if: always()
    needs: [ci, e2e, release-safety, public-api, deny, audit, markers, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(printf '%s\n' "$RESULTS" | jq '[.[] | select(.result != "success" and .result != "skipped")] | length')
          [ "$bad" -eq 0 ]

  # Release builds must not contain the dev control socket or other dev-only
  # code (ADR 0016, ADR 0032).
  release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: $/.github/actions/install-just
      # Zig and libghostty-vt's tarballs for oso-term's build script (ADR 0120).
      - uses: $/.github/actions/install-zig
      - uses: $/.github/actions/fetch-ghostty-vt
      - run: just release-safety

  # The public API must match guardrails/public-api (ADR 0038). Nightly is
  # installed only here, for rustdoc JSON; versions come from the Justfile.
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: $/.github/actions/install-just
      # install-action has no cargo-public-api binary, so build it from
      # crates.io with its lockfile.
      - name: Install nightly and cargo-public-api
        run: |
          rustup toolchain install "$(just --evaluate nightly)" --profile minimal
          rustup target add --toolchain "$(just --evaluate nightly)" "$(just --evaluate api_target)"
          cargo install --locked "cargo-public-api@$(just --evaluate cargo_public_api)"
      - run: just public-api-check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Not cargo-deny-action: its image downloads cargo-deny without a
      # checksum. install-action verifies one.
      - uses: taiki-e/install-action@v2.87.29
        id: tools
        continue-on-error: true
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      # Release downloads fail now and then (HTTP 504). Wait, then try once more,
      # still checking checksums.
      - if: steps.tools.outcome == 'failure'
        run: sleep 60
      - if: steps.tools.outcome == 'failure'
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2.87.29
        id: tools
        continue-on-error: true
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      # Release downloads fail now and then (HTTP 504). Wait, then try once more,
      # still checking checksums.
      - if: steps.tools.outcome == 'failure'
        run: sleep 60
      - if: steps.tools.outcome == 'failure'
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit

  # Conflict markers in any tracked file, docs included, without a build. `just ci` runs
  # the architecture test that holds the same check (ADR 0038).
  markers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: $/.github/actions/install-just
      - run: just markers

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Through the API with the job's token, as anonymous release downloads fail now and
      # then (HTTP 504), with a few tries; the checksum is pinned all the same.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          for attempt in 1 2 3; do
            gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks --pattern "$tarball" --clobber && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "::warning::download $attempt of 3 failed"
            sleep $((attempt * 20))
          done
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Allowlists in the repository could silence the scan. Adding one needs
      # approval and a change to this step.
      - name: Reject gitleaks allowlists
        run: |
          for f in .gitleaks.toml .gitleaksignore; do
            if [ -e "$f" ]; then echo "::error::$f is not allowed"; exit 1; fi
          done
      - name: Scan the full history
        run: gitleaks git --redact --no-banner --ignore-gitleaks-allow
