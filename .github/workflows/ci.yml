# CI for oso (ADR 0018, ADR 0021). Actions are pinned by commit SHA; update
# the SHA and the version comment together.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a pull request changes nothing but docs/, which builds nothing: then only the
  # secrets scan and the conflict markers run, and the jobs that build are skipped. A push
  # to main always runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # The base and the head, for the merge base between them.
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # What the pull request changes, from where it left the base.
            changed=$(git diff --name-only "$BASE...$HEAD")
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^docs/'; then
              docs_only=true
            fi
          fi
          echo "docs-only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  ci:
    name: just ci (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Only main writes the cache, so pull requests cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: $/.github/actions/install-just
      # Zig and libghostty-vt's tarballs for oso-term's build script (ADR 0120); Windows
      # builds no terminal yet.
      - if: runner.os != 'Windows'
        uses: $/.github/actions/install-zig
      - if: runner.os != 'Windows'
        uses: $/.github/actions/fetch-ghostty-vt
      # On Windows, just runs recipes with Git Bash's sh. Fail early if missing.
      - run: sh -c 'command -v sh'
      - run: just ci
      # oso-platform's macOS API, with oso's own window layer, has a snapshot of its own,
      # taken on macOS (ADR 0070). It runs here rather than in a job of its own, so that a
      # push starts one macOS job fewer. Nightly is installed only for it, for rustdoc JSON;
      # versions come from the Justfile.
      - name: Install nightly and cargo-public-api
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install "$(just --evaluate nightly)" --profile minimal
          rustup target add --toolchain "$(just --evaluate nightly)" "$(just --evaluate api_macos_target)"
          cargo install --locked "cargo-public-api@$(just --evaluate cargo_public_api)"
      - name: Public API on macOS
        if: runner.os == 'macOS'
        run: just public-api-macos-check
      # The macOS release binary has oso's own window layer, with dev-only code of its own, so
      # it is searched here too, as the release-safety job searches Linux's (ADR 0016,
      # ADR 0070).
      - name: Release safety on macOS
        if: runner.os == 'macOS'
        run: just release-safety
      # Warns, and does not fail. The budget is 30 s on the author's Mac, and
      # this runner takes twice as long: 7.6 to 9.4 s against 4.6 s (ADR 0050).
      - name: Test time budget
        if: runner.os == 'Linux'
        run: just test-time 60

  # Release builds must not contain the dev control socket or other dev-only
  # code (ADR 0016, ADR 0032).
  release-safety:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: $/.github/actions/install-just
      # Zig and libghostty-vt's tarballs for oso-term's build script (ADR 0120).
      - uses: $/.github/actions/install-zig
      - uses: $/.github/actions/fetch-ghostty-vt
      - run: just release-safety

  # The public API must match guardrails/public-api (ADR 0038). Nightly is
  # installed only here, for rustdoc JSON; versions come from the Justfile.
  public-api:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: $/.github/actions/install-just
      # install-action has no cargo-public-api binary, so build it from
      # crates.io with its lockfile.
      - name: Install nightly and cargo-public-api
        run: |
          rustup toolchain install "$(just --evaluate nightly)" --profile minimal
          rustup target add --toolchain "$(just --evaluate nightly)" "$(just --evaluate api_target)"
          cargo install --locked "cargo-public-api@$(just --evaluate cargo_public_api)"
      - run: just public-api-check

  deny:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Not cargo-deny-action: its image downloads cargo-deny without a
      # checksum. install-action verifies one.
      - uses: taiki-e/install-action@v2.87.29
        id: tools
        continue-on-error: true
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      # Release downloads fail now and then (HTTP 504). Wait, then try once more,
      # still checking checksums.
      - if: steps.tools.outcome == 'failure'
        run: sleep 60
      - if: steps.tools.outcome == 'failure'
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check

  audit:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2.87.29
        id: tools
        continue-on-error: true
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      # Release downloads fail now and then (HTTP 504). Wait, then try once more,
      # still checking checksums.
      - if: steps.tools.outcome == 'failure'
        run: sleep 60
      - if: steps.tools.outcome == 'failure'
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit

  # Conflict markers in any tracked file, docs included, without a build. `just ci` runs
  # the architecture test that holds the same check (ADR 0038).
  markers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # just from the cache or its release through the API, checked (.github/actions).
      - uses: $/.github/actions/install-just
      - run: just markers

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Through the API with the job's token, as anonymous release downloads fail now and
      # then (HTTP 504), with a few tries; the checksum is pinned all the same.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          for attempt in 1 2 3; do
            gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks --pattern "$tarball" --clobber && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "::warning::download $attempt of 3 failed"
            sleep $((attempt * 20))
          done
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Allowlists in the repository could silence the scan. Adding one needs
      # approval and a change to this step.
      - name: Reject gitleaks allowlists
        run: |
          for f in .gitleaks.toml .gitleaksignore; do
            if [ -e "$f" ]; then echo "::error::$f is not allowed"; exit 1; fi
          done
      - name: Scan the full history
        run: gitleaks git --redact --no-banner --ignore-gitleaks-allow
