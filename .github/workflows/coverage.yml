# Coverage on pushes to main and nightly, in the job summary (ADR 0037, ADR 0050,
# ADR 0166). It only informs: every step that can fail continues, so neither low numbers
# nor a broken tool can fail the build.
name: Coverage

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  schedule:
    # Nightly, 17:00 UTC (ADR 0166).
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to main never cancels a running run: the next one waits, and GitHub replaces
  # only a waiting run with a newer one (ADR 0188). The event is in the group, so a nightly
  # run does not wait for a push's.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: never

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
      # llvm-tools only here: rust-toolchain.toml stays minimal.
      - run: |
          rustup toolchain install
          rustup component add llvm-tools
        continue-on-error: true
      # just from the cache or its release through the API, checked (.github/actions).
      - continue-on-error: true
        uses: $/.github/actions/install-just
      # Zig and libghostty-vt's tarballs for oso-term's build script (ADR 0120).
      - uses: $/.github/actions/install-zig
      - uses: $/.github/actions/fetch-ghostty-vt
      - uses: taiki-e/install-action@v2.87.29
        continue-on-error: true
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - id: coverage
        run: just coverage target/coverage/summary.md
        continue-on-error: true
        # Below the job's limit, so that a hang reaches the step below.
        timeout-minutes: 25
      - name: Report
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            tee -a "$GITHUB_STEP_SUMMARY" <target/coverage/summary.md
          else
            echo "::warning::no coverage report: the coverage run ended with '$OUTCOME'. This does not affect the build."
          fi
