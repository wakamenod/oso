# Coverage on pull requests, in the job summary (ADR 0037, ADR 0050). It only
# informs: every step that can fail continues, so neither low numbers nor a
# broken tool can fail the build.
name: Coverage

on:
  pull_request:
    paths-ignore: ["docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
      # llvm-tools only here: rust-toolchain.toml stays minimal.
      - run: |
          rustup toolchain install
          rustup component add llvm-tools
        continue-on-error: true
      # just from the cache or its release through the API, checked (.github/actions).
      - continue-on-error: true
        uses: $/.github/actions/install-just
      - uses: taiki-e/install-action@v2.87.29
        continue-on-error: true
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - id: coverage
        run: just coverage target/coverage/summary.md
        continue-on-error: true
        # Below the job's limit, so that a hang reaches the step below.
        timeout-minutes: 25
      - name: Report
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            tee -a "$GITHUB_STEP_SUMMARY" <target/coverage/summary.md
          else
            echo "::warning::no coverage report: the coverage run ended with '$OUTCOME'. This does not affect the build."
          fi
