name: Install just
description: >-
  just 1.52.0 on Linux, macOS and Windows. The archive comes from the actions cache or,
  on a miss, from just's GitHub release through the API with the job's token, as
  anonymous release downloads fail now and then (HTTP 504). Every archive, cached or
  fetched, is checked against a checksum pinned here before it is unpacked.

runs:
  using: composite
  steps:
    - name: Choose just's archive
      id: pick
      shell: bash
      run: |
        # Checksums from just's SHA256SUMS for 1.52.0, the same as install-action's manifest.
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            asset=just-1.52.0-x86_64-unknown-linux-musl.tar.gz
            sum=e0a712614574d45625332529c864754e26782422b7c7db931466180a618f092d ;;
          macOS-ARM64)
            asset=just-1.52.0-aarch64-apple-darwin.tar.gz
            sum=1538caf566c9d8dd99286a21c0e1224b89f6676b70c16a4bcbeb52dd21fc78f5 ;;
          Windows-X64)
            asset=just-1.52.0-x86_64-pc-windows-msvc.zip
            sum=ac53a7da91a33e344042dbec11e4bf1e1ec1d65ca4b695fe71398206d2a1630d ;;
          *) echo "::error::no pinned just archive for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        {
          echo "asset=$asset"
          echo "sum=$sum"
          echo "dir=$RUNNER_TEMP/just-archive"
        } >> "$GITHUB_OUTPUT"

    - name: Restore just's archive
      id: cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.pick.outputs.dir }}
        key: just-1.52.0-${{ runner.os }}-${{ runner.arch }}

    - name: Download just's archive
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ASSET: ${{ steps.pick.outputs.asset }}
        DIR: ${{ steps.pick.outputs.dir }}
      run: |
        mkdir -p "$DIR"
        for attempt in 1 2 3; do
          if gh release download 1.52.0 --repo casey/just --pattern "$ASSET" --dir "$DIR" --clobber; then
            exit 0
          fi
          echo "::warning::download $attempt of 3 failed"
          sleep $((attempt * 20))
        done
        exit 1

    # Only main writes the cache, as with the build cache (ADR 0021). The archive is
    # checked below before anything uses it, and saved only once it has been.
    - name: Check just's archive
      shell: bash
      env:
        ASSET: ${{ steps.pick.outputs.asset }}
        SUM: ${{ steps.pick.outputs.sum }}
        DIR: ${{ steps.pick.outputs.dir }}
      run: |
        cd "$DIR"
        # A cached archive is checked as well, so the cache cannot hand over another file.
        if command -v sha256sum >/dev/null; then
          echo "$SUM  $ASSET" | sha256sum -c -
        else
          echo "$SUM  $ASSET" | shasum -a 256 -c -
        fi

    - name: Save just's archive
      if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ steps.pick.outputs.dir }}
        key: just-1.52.0-${{ runner.os }}-${{ runner.arch }}

    - name: Unpack just
      shell: bash
      env:
        ASSET: ${{ steps.pick.outputs.asset }}
        SUM: ${{ steps.pick.outputs.sum }}
        DIR: ${{ steps.pick.outputs.dir }}
      run: |
        cd "$DIR"
        bin="$RUNNER_TEMP/just-bin"
        mkdir -p "$bin"
        if [ "$RUNNER_OS" = Windows ]; then
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$ASSET' -DestinationPath '$bin' -Force"
        else
          tar -xzf "$ASSET" -C "$bin" just
        fi
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/just" --version
