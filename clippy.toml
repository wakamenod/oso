# Spawn processes only through oso-platform::process, and no network code
# (ADR 0010). Paths into crates that are not dependencies are ignored, so the
# async spawn APIs are listed ahead of time.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "spawn only through oso-platform::process (ADR 0010)" },
    { path = "tokio::process::Command::new", reason = "spawn only through oso-platform::process (ADR 0010)" },
    { path = "async_process::Command::new", reason = "spawn only through oso-platform::process (ADR 0010)" },
    # What spawns without `Command`, and the hook that runs in a forked child (ADR 0120).
    # macOS has no `vfork`, `fexecve`, `execvpe` or `clone` in `libc`.
    { path = "std::os::unix::process::CommandExt::pre_exec", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::fork", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::vfork", reason = "spawn only through oso-platform::process (ADR 0120)", allow-invalid = true },
    { path = "libc::execv", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::execve", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::execvp", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::execl", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::execle", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::execlp", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::fexecve", reason = "spawn only through oso-platform::process (ADR 0120)", allow-invalid = true },
    { path = "libc::posix_spawn", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::posix_spawnp", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::system", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::popen", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::forkpty", reason = "spawn only through oso-platform::process (ADR 0120)" },
    { path = "libc::execvpe", reason = "spawn only through oso-platform::process (ADR 0120)", allow-invalid = true },
    { path = "libc::clone", reason = "spawn only through oso-platform::process (ADR 0120)", allow-invalid = true },
    { path = "std::os::unix::process::CommandExt::before_exec", reason = "spawn only through oso-platform::process (ADR 0120)" },
]
disallowed-types = [
    { path = "std::net::TcpListener", reason = "no network code in oso (ADR 0010)" },
    { path = "std::net::TcpStream", reason = "no network code in oso (ADR 0010)" },
    { path = "std::net::UdpSocket", reason = "no network code in oso (ADR 0010)" },
    # Local sockets only in the control sockets' transport (oso-platform::control): the dev
    # control socket and the agent channel.
    { path = "std::os::unix::net::UnixListener", reason = "local sockets only in oso-platform::control (ADR 0032, ADR 0085)" },
    { path = "std::os::unix::net::UnixStream", reason = "local sockets only in oso-platform::control (ADR 0032, ADR 0085)" },
    { path = "std::os::unix::net::UnixDatagram", reason = "local sockets only in oso-platform::control (ADR 0032, ADR 0085)" },
    # No global state: commands work on host-owned state (ADR 0038). An
    # exception needs `#[expect(clippy::disallowed_types, reason = "...")]`.
    { path = "std::sync::OnceLock", reason = "no global state; keep state host-owned (ADR 0038)" },
    { path = "std::sync::LazyLock", reason = "no global state; keep state host-owned (ADR 0038)" },
    { path = "once_cell::sync::OnceCell", reason = "no global state; keep state host-owned (ADR 0038)" },
    { path = "once_cell::sync::Lazy", reason = "no global state; keep state host-owned (ADR 0038)" },
]
disallowed-macros = [
    { path = "std::thread_local", reason = "no global state; keep state host-owned (ADR 0038)" },
    { path = "lazy_static::lazy_static", reason = "no global state; keep state host-owned (ADR 0038)" },
    # Output goes through `log`, and unfinished code is a real error (ADR 0038).
    { path = "std::println", reason = "use `log` (ADR 0038)" },
    { path = "std::print", reason = "use `log` (ADR 0038)" },
    { path = "std::eprintln", reason = "use `log` (ADR 0038)" },
    { path = "std::eprint", reason = "use `log` (ADR 0038)" },
    { path = "std::dbg", reason = "remove debugging output, or use `log` (ADR 0038)" },
    { path = "std::todo", reason = "return a real error instead (ADR 0038)" },
    { path = "std::unimplemented", reason = "return a real error instead (ADR 0038)" },
]

# Size limits (ADR 0038). Changing them needs a new ADR. A function over the
# limit needs `#[expect(clippy::too_many_lines, reason = "...")]`.
too-many-lines-threshold = 80
cognitive-complexity-threshold = 25

# `unwrap_used` and `expect_used` are denied in oso-core (ADR 0038). Tests may
# unwrap.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
