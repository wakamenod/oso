# cargo-deny configuration. Policy: ADR 0010 (dependencies, network, regex)
# and ADR 0020 (license). Changes to this file need human approval.

[graph]
# Check every feature, so a crate behind a dev or optional feature is not
# missed.
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained. It is pulled in only by winit's Wayland
    # client-side decorations (sctk-adwaita -> ab_glyph), which read system
    # fonts for title bars, not file content. Revisit when winit is upgraded.
    { id = "RUSTSEC-2026-0192", reason = "transitive via winit/sctk-adwaita; no replacement yet" },
]

[licenses]
# Permissive licenses compatible with MIT OR Apache-2.0 (ADR 0020). Keep this
# list minimal: add a license only when a dependency needs it.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
# crates.io only.
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates carry no version. Allowed because
# every crate is `publish = false` (ADR 0021).
allow-wildcard-paths = true
deny = [
    # No network code in oso (ADR 0010).
    { crate = "reqwest", reason = "no network code in oso (ADR 0010)" },
    { crate = "hyper", reason = "no network code in oso (ADR 0010)" },
    { crate = "h2", reason = "no network code in oso (ADR 0010)" },
    { crate = "ureq", reason = "no network code in oso (ADR 0010)" },
    { crate = "curl", reason = "no network code in oso (ADR 0010)" },
    { crate = "isahc", reason = "no network code in oso (ADR 0010)" },
    { crate = "surf", reason = "no network code in oso (ADR 0010)" },
    { crate = "attohttpc", reason = "no network code in oso (ADR 0010)" },
    { crate = "tungstenite", reason = "no network code in oso (ADR 0010)" },
    { crate = "native-tls", reason = "no network code in oso (ADR 0010)" },
    { crate = "openssl", reason = "no network code in oso (ADR 0010)" },
    { crate = "rustls", reason = "no network code in oso (ADR 0010)" },
    { crate = "openssl-sys", reason = "no network code in oso (ADR 0010)" },
    { crate = "curl-sys", reason = "no network code in oso (ADR 0010)" },
    { crate = "libssh2-sys", reason = "no network code in oso (ADR 0010)" },
    { crate = "ssh2", reason = "no network code in oso (ADR 0010)" },
    { crate = "hyper-util", reason = "no network code in oso (ADR 0010)" },
    { crate = "socket2", reason = "no network code in oso (ADR 0010)" },
    { crate = "quinn", reason = "no network code in oso (ADR 0010)" },
    { crate = "hickory-proto", reason = "no network code in oso (ADR 0010)" },
    { crate = "hickory-resolver", reason = "no network code in oso (ADR 0010)" },
    # Only the linear-time regex crate (ADR 0010).
    { crate = "fancy-regex", reason = "backtracking regex engine; use regex (ADR 0010)" },
    { crate = "onig", reason = "backtracking regex engine; use regex (ADR 0010)" },
    { crate = "pcre2", reason = "backtracking regex engine; use regex (ADR 0010)" },
    { crate = "regress", reason = "backtracking regex engine; use regex (ADR 0010)" },
    # Spawn processes only through oso-platform::process (ADR 0010).
    { crate = "duct", reason = "spawns processes; use oso-platform::process (ADR 0010)" },
    { crate = "subprocess", reason = "spawns processes; use oso-platform::process (ADR 0010)" },
    { crate = "xshell", reason = "spawns processes; use oso-platform::process (ADR 0010)" },
    { crate = "open", reason = "spawns processes; use oso-platform::process (ADR 0010)" },
    { crate = "opener", reason = "spawns processes; use oso-platform::process (ADR 0010)" },
    { crate = "webbrowser", reason = "spawns processes; use oso-platform::process (ADR 0010)" },
    # External crates stay in their owning crate (ADR 0038). `wrappers` lists
    # the only crates that may depend on them directly. OS bindings have many
    # third-party dependents, so crates/oso/tests/architecture confines them
    # to oso-platform instead (ADR 0039).
    { crate = "wgpu", wrappers = ["oso-render"], reason = "GPU code stays in oso-render (ADR 0038)" },
    { crate = "winit", wrappers = ["oso"], reason = "window code stays in the oso tip crate (ADR 0038)" },
]
