[package]
name = "oso"
description = "An Emacs-like GUI editor: the binary, commands, default keymaps and app glue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
oso-core.workspace = true
oso-render.workspace = true
oso-platform.workspace = true
oso-syntax.workspace = true
pollster.workspace = true
log.workspace = true
env_logger.workspace = true
similar.workspace = true
# JSON Lines for the control sockets: the dev one, and the agent channel in every build
# (ADR 0085).
serde_json.workspace = true
# The user configuration file, read in `config` only (ADR 0108).
toml.workspace = true
# The project walker, in `walk` only (ADR 0114).
ignore.workspace = true
# The rules that tell a hosted session's state from its screen (ADR 0121), the only engine
# allowed (ADR 0010). oso-core's version and features, so the tree gains no crate.
regex = { version = "1.12.4", default-features = false, features = ["std", "unicode-case", "unicode-perl", "unicode-gencat", "perf"] }
miniz_oxide = { workspace = true, optional = true }

# The window system on Windows and Linux; macOS has oso's own (ADR 0070, stage 3).
[target.'cfg(not(target_os = "macos"))'.dependencies]
winit.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[features]
# Dev-only tooling: the control socket, `oso ctl` and the timings benchmarks
# read (ADR 0016, ADR 0023, ADR 0046).
# Never a default feature. CI checks that release builds contain none of it.
dev = ["dep:miniz_oxide", "oso-platform/dev", "oso-render/dev"]

# The benchmark harness, which drives the app over the control socket
# (ADR 0025, ADR 0046).
[[example]]
name = "perf"
required-features = ["dev"]
test = true

# End-to-end flows through a real dev build (ADR 0037, ADR 0049). Their tests are
# ignored, since they open windows; `just e2e` runs them.
[[test]]
name = "e2e"
required-features = ["dev"]

[lints]
workspace = true
