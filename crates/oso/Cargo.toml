[package]
name = "oso"
description = "An Emacs-like GUI editor: the binary, commands, default keymaps and app glue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
oso-core.workspace = true
oso-render.workspace = true
oso-platform.workspace = true
winit.workspace = true
pollster.workspace = true
log.workspace = true
env_logger.workspace = true
similar.workspace = true
serde_json = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[features]
# Dev-only tooling: the control socket, `oso ctl` and the timings benchmarks
# read (ADR 0016, ADR 0023, ADR 0046).
# Never a default feature. CI checks that release builds contain none of it.
dev = ["dep:serde_json", "dep:miniz_oxide", "oso-platform/dev", "oso-render/dev"]

# oso's own window layer in place of winit, on macOS (ADR 0070, stage 2). Off by default
# until it is at parity; elsewhere it changes nothing yet.
native-window = ["oso-platform/native-window"]

# The benchmark harness, which drives the app over the control socket
# (ADR 0025, ADR 0046).
[[example]]
name = "perf"
required-features = ["dev"]
test = true

# End-to-end flows through a real dev build (ADR 0037, ADR 0049). Their tests are
# ignored, since they open windows; `just e2e` runs them.
[[test]]
name = "e2e"
required-features = ["dev"]

[lints]
workspace = true
