[package]
name = "oso-platform"
description = "oso OS abstractions: text backends, IME, clipboard, filesystem, processes, PTY"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
log = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

# The CoreText text system (ADR 0005, ADR 0036). Only the bindings it uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true

[features]
# The dev control socket transport (ADR 0016) and process spawning (ADR 0010).
# Enabled only by `oso/dev`.
dev = ["dep:libc", "dep:log"]

[lints]
workspace = true
