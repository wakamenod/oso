[package]
name = "oso-platform"
description = "oso OS abstractions: text backends, IME, clipboard, filesystem, processes, PTY"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
log = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The CoreText text system (ADR 0005, ADR 0036). Only the bindings it uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
unicode-segmentation.workspace = true
# The clipboard (ADR 0074) and oso's own window layer, the default on macOS (ADR 0070,
# stage 3).
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-quartz-core.workspace = true
raw-window-handle.workspace = true
log.workspace = true

[features]
# Process spawning (ADR 0010, ADR 0047) and the log lines of the dev tooling. The
# control sockets' transport is in every build (ADR 0085). Enabled only by `oso/dev`.
dev = ["dep:log"]

[lints]
workspace = true
