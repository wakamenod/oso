[package]
name = "oso-platform"
description = "oso OS abstractions: text backends, IME, clipboard, filesystem, processes, PTY"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The spawn log line (ADR 0047), in every build since the terminal ships (ADR 0120).
log.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The CoreText text system (ADR 0005, ADR 0036). Only the bindings it uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
unicode-segmentation.workspace = true
# The clipboard (ADR 0074) and oso's own window layer, the default on macOS (ADR 0070,
# stage 3).
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-quartz-core.workspace = true
raw-window-handle.workspace = true

[features]
# The dev tooling's code in the window layer and the memory clipboard. Process spawning
# (ADR 0120) and the control sockets' transport (ADR 0085) are in every build. Enabled
# only by `oso/dev`.
dev = []

[lints]
workspace = true
