[package]
name = "oso-render"
description = "oso wgpu rendering pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
oso-core.workspace = true
oso-platform.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
log.workspace = true

# One wgpu backend per OS (ADR 0003). Keep in sync with `platform_backend()`.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[features]
# Frame capture for the dev control socket's `screenshot` (ADR 0016), and the
# GPU in use, for benchmarks (ADR 0046).
# Enabled only by `oso/dev`.
dev = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
