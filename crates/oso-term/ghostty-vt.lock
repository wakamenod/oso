# The libghostty-vt release oso-term builds (ADR 0120). `just ghostty-vt` fetches the two
# tarballs and checks each against the minisign key and its sha256 below; build.rs checks the
# sha256 again before it unpacks, and fails unless the dependency tarball holds exactly the
# packages listed (each read and listed in third-party.md). It then applies oso's patches
# (patches/, `patch` lines, in order), each checked against its sha256, and fails unless each
# `patched` file has its sha256. A bump changes every line here and re-reads third-party.md;
# it drops a patch the new release makes needless, or rebases it and updates its hashes. Any
# change to this file is fuzzed again (`just fuzz-term`, on macOS and on Linux) before it lands.
