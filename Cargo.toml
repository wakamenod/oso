[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.96"

[workspace.dependencies]
oso-core = { path = "crates/oso-core" }
oso-render = { path = "crates/oso-render" }
oso-platform = { path = "crates/oso-platform" }

winit = "0.30"
# Backends are enabled per OS in crates/oso-render (ADR 0003): no GL and no
# backend that the OS does not use is compiled in.
wgpu = { version = "29.0", default-features = false, features = ["std", "parking_lot", "wgsl"] }
pollster = "0.3"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }
# Grapheme clusters (UAX #29) and East Asian Width (UAX #11) for the display
# model's cell grid (ADR 0005, ADR 0035). Same Unicode version in both.
unicode-segmentation = "1.13.3"
unicode-width = { version = "0.2.3", default-features = false }
# CoreText and CoreGraphics bindings for the macOS text system (ADR 0036).
# The objc2 family is already in the tree through wgpu's Metal backend.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFString", "CFAttributedString", "CFDictionary", "CFArray", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGContext", "CGBitmapContext", "CGColorSpace", "CGImage"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor", "CTFontTraits", "CTLine", "CTRun", "CTStringAttributes", "objc2-core-graphics"] }
# Property-based testing: automatically explores boundary values (e.g. usize::MAX).
proptest = "1"

# Dev-only (the `dev` features, ADR 0016). Release builds never contain them.
# JSON Lines for the control socket (ADR 0023); used through `Value` only, so
# without serde's derive macros.
serde_json = "1"
# Deflate for screenshot PNGs. Pure Rust, forbids `unsafe`.
miniz_oxide = "0.9"
# Peer credentials and the effective user ID for the control socket.
libc = "0.2"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
allow_attributes_without_reason = "deny"

# Optimize dependencies, not oso, so the tip crate rebuilds within 2 s and
# GPU code still runs fast in dev builds (ADR 0024).
[profile.dev.package."*"]
opt-level = 2
debug = false

# ADR 0004. `panic` stays at the default `unwind` (ADR 0014).
[profile.release]
lto = true
codegen-units = 1
